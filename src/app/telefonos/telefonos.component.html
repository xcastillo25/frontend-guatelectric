<main class="telefonos-container">
  <div class="registro">
    <h4>Registrar telefonos:</h4>
    <div class="group">
      <div class="info">
        <div class="datos">
          <label>Teléfono:</label>
          <input type="text" [(ngModel)]="telefono" />
        </div>
      </div>

    </div>
    <div class="buttons">
      <button (click)="agregarTelefono()" [hidden]="editingMode" [disabled]="addingTelephone">
        <ng-container *ngIf="!addingTelephone; else addingTelephoneText">Agregar</ng-container>
      </button>
      <ng-template #addingTelephoneText>
          Agregando...
      </ng-template>
      <button (click)="actualizarTelefono()" [hidden]="!editingMode" [disabled]="updatingTelephone">
          <ng-container *ngIf="!updatingTelephone; else updatingTelephoneText">Actualizar</ng-container>
      </button>
      <ng-template #updatingTelephoneText>
          Actualizando...
      </ng-template>
      <button (click)="resetCampos()">
        Nuevo
      </button>
    </div>
  </div>
  <div class="tabla">
    <div class="buscar">
      <label>Buscar por:</label>
      <select [(ngModel)]="selectedItem">
        <option value="telefono">Teléfono</option>
      </select>
      <div class="buscar-input">
        <input [(ngModel)]="searchTerm" placeholder="Ingrese término de búsqueda">
        <mat-icon>search</mat-icon>
      </div>
      <mat-icon (click)="limpiarBusqueda()">delete</mat-icon>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Teléfono</th>
                <th>Activo</th>
                <th>Estado</th>
                <th>Eliminar</th>
            </tr>
        </thead>
        <tbody>
          <tr *ngFor="let telefono of telefonos" (click)="cargarTelefonoSeleccionado(telefono)"
          [hidden]="!buscarPorPropiedad(telefono)">
                <td>{{ telefono.idtelefono }}</td>
                <td>{{ telefono.telefono }}</td>
                <td>
                    <span [ngClass]="{'activo': telefono.estado, 'no-activo': !telefono.estado}">
                        {{ telefono.estado ? 'Sí' : 'No' }}
                    </span>
                </td>
                <td>
                  <button class="button-activo" (click)="cambiarEstadoTelefono(telefono.idtelefono)">
                    Cambiar
                  </button>
                </td>
                <td>
                  <button class="button-delete" (click)="eliminarTelefono(telefono.idtelefono)">
                    <mat-icon>delete</mat-icon>
                  </button>
              </td>
            </tr>
        </tbody>
    </table>
  </div>
</main>
