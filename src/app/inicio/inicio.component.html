<main class="inicio">
  <h1>Bienvenido al Sistema De GuatElectric</h1>
  <div class="ubication">
    <div class="medidor-container">
      <div #mapContainer class="map-container" style="width: 100%; height: 400px;"></div>
    </div>
    <div class="map-buttons">
      <button (click)="locate()">
        <mat-icon>my_location</mat-icon>
        Ubicar
      </button>
      <button (click)="increaseZoom()">
        <mat-icon>add</mat-icon>
      </button>
      <button (click)="decreaseZoom()">
        <mat-icon>remove</mat-icon>
      </button>
      <button (click)="toggleFullScreen()">
        <mat-icon>open_in_full</mat-icon>
      </button>
    </div>
  </div>
</main>
